<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CoBuilt Admin</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#F06E22;--bg:#0D0D0F;--panel:#141417;--panel2:#1A1A1E;--line:#2A2A30;--text:#F2F2F3;--muted:#A1A1AA;--ok:#4ADE80;--bad:#F87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
h1,h2,h3{font-family:Oswald,Inter,sans-serif;font-weight:600;margin:0;letter-spacing:.3px}
button,input,textarea,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#44444c}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0D0D0F}
.btn.primary:hover{background:#FF8A45}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn.icon{width:34px;padding:0}
input[type=text],input[type=number],input[type=password],input[type=email],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;min-height:44px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.field{margin-bottom:20px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px}
.login .logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login .logo img{width:44px}
.login ol{margin:12px 0 20px;padding-left:20px;color:var(--muted);font-size:14px;line-height:1.7}
.msg{font-size:14px;margin-top:12px;min-height:20px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}

/* app */
.app{display:none;min-height:100vh}
.app.on{display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(13,13,15,.92);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);flex-wrap:wrap}
.bar .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.bar .brand img{width:34px}
.bar .brand b{font-family:Oswald,sans-serif;font-size:20px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:9px;background:var(--ok)}
.dot.dirty{background:var(--accent);box-shadow:0 0 0 4px rgba(240,110,34,.2)}
.body{display:flex;flex:1;min-height:0}
.side{width:250px;flex:none;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:63px;height:calc(100vh - 63px);overflow:auto}
.side button{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:11px 12px;border-radius:8px;background:transparent;border:0;color:var(--muted);font-weight:500;font-size:15px;cursor:pointer;min-height:44px}
.side button:hover{background:var(--panel2);color:var(--text)}
.side button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.side .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#2A2A30;color:var(--muted)}
.side .tag.off{background:#3a1d1d;color:#fca5a5}
.main{flex:1;min-width:0;padding:28px 32px 120px;max-width:920px}
.main h2{font-size:30px;margin-bottom:6px}
.main .desc{color:var(--muted);margin:0 0 26px;font-size:15px}
.mob-nav{display:none;margin-bottom:20px}
.toggle{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:24px;cursor:pointer;min-height:52px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}

/* image field */
.img{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.img .thumb{width:180px;height:120px;border-radius:8px;background:#222 center/contain no-repeat;border:1px solid var(--line);flex:none;position:relative}
.img .thumb.light{background-color:#fff}
.img .thumb .new{position:absolute;top:6px;left:6px;background:var(--accent);color:#0D0D0F;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.img .act{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.img .path{font-size:12px;color:var(--muted);word-break:break-all}
.drop{outline:2px dashed var(--accent);outline-offset:2px}

/* lists */
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.item .ih{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.item .ih b{margin-right:auto;font-size:14px;color:var(--muted)}
.item .field:last-child{margin-bottom:0}
.str{display:flex;gap:6px;align-items:center}
.str input{flex:1}
.add{margin-top:12px}

/* color */
.color{display:flex;gap:10px;align-items:center}
.color input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}

/* toast + overlay */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:#1F1F23;border:1px solid #3A3A42;padding:12px 18px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:#166534}.toast.bad{border-color:#7f1d1d}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:480px;width:100%}
.dialog h3{font-size:24px;margin-bottom:10px}
.dialog p{color:var(--muted);line-height:1.6;margin:0 0 18px}
.dialog .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.spin{width:18px;height:18px;border:2px solid rgba(0,0,0,.25);border-top-color:#0D0D0F;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .side{display:none}
  .mob-nav{display:block}
  .main{padding:20px 16px 120px}
  .bar{padding:10px 12px}
  .bar .hide-sm{display:none}
  .img .thumb{width:100%;height:160px}
}
</style>
</head>
<body>

<!-- Login -->
<section class="login" id="login">
  <div class="box">
    <div class="logo"><img src="/assets/img/mark.png" alt=""><h1>CoBuilt Admin</h1></div>
    <p class="hint" style="margin-top:0">Sign in with your GitHub access key. Changes you publish go straight to your website.</p>
    <div class="field" style="margin-top:18px">
      <label class="lbl" for="token">GitHub access key</label>
      <input id="token" type="password" autocomplete="current-password" placeholder="github_pat_…">
      <p class="hint">Don't have one? See <b>SETUP-GUIDE</b> step 3 — it takes 2 minutes.</p>
    </div>
    <details style="margin-bottom:18px">
      <summary class="hint" style="cursor:pointer">Advanced: repository settings</summary>
      <div class="field" style="margin-top:12px"><label class="lbl" for="repo">Repository</label><input id="repo" type="text" value="africatechnologyet/CoBuilt_Website"></div>
      <div class="field"><label class="lbl" for="branch">Branch</label><input id="branch" type="text" value="main"></div>
    </details>
    <label class="toggle" style="margin-bottom:18px"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
    <button class="btn primary" id="signin" style="width:100%;min-height:50px">Sign in</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </div>
</section>

<!-- App -->
<div class="app" id="app">
  <div class="bar">
    <div class="brand"><img src="/assets/img/mark.png" alt=""><b>CoBuilt Admin</b></div>
    <span class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">All changes published</span></span>
    <a class="btn hide-sm" href="/" target="_blank" rel="noopener">View site</a>
    <button class="btn" id="previewBtn">Preview</button>
    <button class="btn primary" id="publishBtn">Publish</button>
    <button class="btn icon" id="moreBtn" aria-label="More options" title="More options">⋯</button>
  </div>
  <div class="body">
    <nav class="side" id="side" aria-label="Sections"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<!-- Dialog -->
<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><h3 id="dlgTitle"></h3><p id="dlgText"></p><div class="acts" id="dlgActs"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
